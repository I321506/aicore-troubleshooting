site_name: AI Core Troubleshooting
site_description: Troubleshooting guides and tutorials for SAP AI Core
site_url: https://SmitaNaik05.github.io/aicore-troubleshooting
repo_url: https://github.com/SmitaNaik05/aicore-troubleshooting
repo_name: aicore-troubleshooting
docs_dir: mkdocs-docs
site_dir: site

hooks:
  - hooks.py

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
# nav:
#   - Home: index.md
#   - Troubleshooting Guide:
#       - Overview: troubleshooting/index.md
#       - Timeout Issues:
#           - LLM Requests Timing Out Silently: troubleshooting/llm-requests-timing-out.md
#       - Rate Limit Issues:
#           - Rate Limited at ~100 RPM Despite 2,000 RPM Quota: troubleshooting/rate-limit-issues.md
#   - Orchestration with Grounding: orchestration/index.md
nav:
  - Home: index.md
  - Troubleshooting Guide:
      - Overview: troubleshooting/index.md
      - Timeout Issues: troubleshooting/llm-requests-timing-out.md
      - Rate Limit Issues: troubleshooting/rate-limit-issues.md
      - Onboarding & Authentication Issues: troubleshooting/authentication_onboarding.md
      - Generic LLM Issues: troubleshooting/generic_llm_issues.md
